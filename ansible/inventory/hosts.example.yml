# Copy to inventory/hosts.yml (git-ignored) and replace the placeholders.
# No passwords are stored here: authentication is by SSH key.
all:
  children:
    nexus_servers:
      hosts:
        nexus-server:
          ansible_host: 203.0.113.10          # your EC2 public IP (terraform output public_ip)
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/CHANGE_ME_private_key
