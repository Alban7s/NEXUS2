---
- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    cache_valid_time: 3600

- name: Install required packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Allow SSH through the host firewall
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Enable the host firewall (default deny incoming)
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
