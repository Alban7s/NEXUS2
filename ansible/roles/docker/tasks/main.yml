---
- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: Install Docker Engine and plugins
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Configure Docker daemon (log rotation protects the small disk)
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

# Membership of the docker group is root-equivalent. Only the admin user gets it here.
- name: Let the admin user run docker
  ansible.builtin.user:
    name: "{{ admin_user }}"
    groups: docker
    append: true

- name: Weekly cleanup of unused Docker data
  ansible.builtin.cron:
    name: "docker prune"
    weekday: "0"
    hour: "3"
    minute: "30"
    job: "docker system prune -f --filter until=168h >/dev/null 2>&1"
  when: docker_prune_cron | bool
