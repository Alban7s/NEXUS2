apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: default
  labels:
    app: nexus
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
        - name: nexus
          image: nexus:1789897469
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: default
  labels:
    app: nexus
spec:
  selector:
    app: nexus
  ports:
    - port: 80
      targetPort: 80
  type: NodePort