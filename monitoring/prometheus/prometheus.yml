# Prometheus configuration for NEXUS.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host CPU / memory / disk (node-exporter container)
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Per-container CPU / memory for Docker (cAdvisor)
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # NEXUS application metrics (GET /metrics on the NEXUS API).
  # host.docker.internal resolves to the Docker host (see extra_hosts in docker-compose.yml).
  - job_name: nexus
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # Kubernetes object metrics (pods, deployments) from kube-state-metrics.
  # Apply monitoring/k8s/kube-state-metrics.yaml first, then set the target to
  #   <minikube ip>:30080     (run: minikube ip)
  # Remove this job if you do not use Kubernetes.
  - job_name: kube-state-metrics
    static_configs:
      - targets: ["192.168.49.2:30080"]

  # Health-endpoint monitoring: the blackbox exporter probes URLs over HTTP.
  - job_name: health-endpoints
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8000/healthz     # NEXUS itself
          # Add deployed apps here, e.g. http://host.docker.internal:49153/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
