# kube-state-metrics: exposes pod/deployment health as Prometheus metrics.
#   kubectl apply -f monitoring/k8s/kube-state-metrics.yaml
apiVersion: v1
kind: ServiceAccount
metadata: { name: kube-state-metrics, namespace: kube-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, namespaces, services, endpoints, replicationcontrollers, resourcequotas]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: kube-state-metrics }
subjects:
  - { kind: ServiceAccount, name: kube-state-metrics, namespace: kube-system }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kube-state-metrics, namespace: kube-system, labels: { app: kube-state-metrics } }
spec:
  replicas: 1
  selector: { matchLabels: { app: kube-state-metrics } }
  template:
    metadata: { labels: { app: kube-state-metrics } }
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, initialDelaySeconds: 5 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata: { name: kube-state-metrics, namespace: kube-system, labels: { app: kube-state-metrics } }
spec:
  type: NodePort
  selector: { app: kube-state-metrics }
  ports: [{ port: 8080, targetPort: 8080, nodePort: 30080 }]
